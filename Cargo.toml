[package]
name = "snorm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
annotate-snippets = "0.12.10"
anstream = "1"
anstyle = "1.0.13"
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = { version = "4.6.7", features = ["unstable-dynamic"] }
directories = "6.0.0"
hex = "0.4.3"
mcdata = { version = "0.4", features = ["serde"] }
rustmatica = { version = "0.5.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0"
tempfile = "3.24.0"
toml = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.20"
ureq = "3.3.0"
zip = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }
